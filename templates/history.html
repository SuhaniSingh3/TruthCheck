{% extends 'base.html' %}
{% block title %}Analysis History — TruthCheck AI{% endblock %}
{% block content %}
<div class="analysis-page glass">
  <div class="history-page-header">
    <div>
      <h2>Past Verification Reports</h2>
      <p>Search, filter, favorite, and manage your past verification reports.</p>
    </div>
    <button id="clear-history-btn" class="btn-clear-history glass-btn-danger" title="Clear all verification history">
      🗑️ Clear History
    </button>
  </div>

  <div class="history-controls">
    <input type="text" id="history-search" placeholder="Search report titles, queries, or verdicts...">
    <select id="history-filter-type">
      <option value="">All Verification Types</option>
      <option value="text">News Text / Headline</option>
      <option value="image">AI Image Analysis</option>
    </select>
  </div>

  <div id="history-list" class="recent-feed">
    <div class="loading-state">Loading verification history...</div>
  </div>
</div>
{% endblock %}
