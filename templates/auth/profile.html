{% extends 'base.html' %}
{% block title %}Profile Settings — TruthCheck AI{% endblock %}
{% block content %}
<div class="analysis-page glass">
  <h2>User Profile & Multilingual Preferences</h2>
  <form method="POST" action="{{ url_for('auth.profile') }}">
    <div class="form-group">
      <label>Preferred Response Language</label>
      <select name="language_preference">
        {% for code, name in supported_languages.items() %}
        <option value="{{ code }}" {% if current_user.language_preference == code %}selected{% endif %}>{{ name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Theme Preference</label>
      <select name="theme_preference">
        <option value="cosmic">Cosmic Violet (Default)</option>
        <option value="ocean">Ocean Cyan</option>
        <option value="midnight">Midnight Dark</option>
      </select>
    </div>
    <button type="submit" class="btn-primary">Save Preferences</button>
  </form>
</div>
{% endblock %}
