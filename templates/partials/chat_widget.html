<div class="chat-widget" id="chat-widget">
  <button class="chat-toggle-btn" id="chat-toggle" title="AI Fact-Check Assistant">
    💬 AI Assistant
  </button>
  <div class="chat-panel glass" id="chat-panel" style="display: none;">
    <div class="chat-header">
      <h4>TruthCheck AI Assistant</h4>
      <button id="chat-close" class="close-btn">×</button>
    </div>
    <div class="chat-messages" id="chat-messages">
      <div class="msg ai-msg">Hello! Ask me anything about misinformation detection or reasons behind any verdict.</div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="chat-input" placeholder="Ask why news is fake/real...">
      <button id="chat-send" class="btn-primary">Send</button>
    </div>
  </div>
</div>
